appId: io.github.aitor236.gpt-niang-usage
productName: GPT 娘
copyright: Copyright © 2026 GPT-Niang contributors (MIT)

directories:
  output: dist
  buildResources: build

files:
  - src/**/*
  - renderer/**/*
  - preload.cjs
  - package.json

# The quota backend and the character assets stay shared with the Windows and
# macOS builds instead of being copied into this tree.
extraResources:
  - from: ../gpt-niang-usage/runtime
    to: runtime
    filter:
      - '**/*'
      - '!**/*.test.mjs'
  - from: ../gpt-niang-usage/assets
    to: assets
    filter:
      - gpt-dragon-niang-bust.png
      - press.wav
      - release.wav
      - quotes.json
  # runtime/metadata.mjs reads ../.codex-plugin/plugin.json for the reported
  # version, so the manifest has to sit beside the runtime in the package too.
  - from: ../gpt-niang-usage/.codex-plugin
    to: .codex-plugin
    filter:
      - plugin.json
  # The plugin manifest points at .mcp.json, and the same resources directory can
  # be handed to scripts/register-plugin.sh as the plugin source of the installed
  # app, so it has to be packaged too.
  - from: ../gpt-niang-usage/.mcp.json
    to: .mcp.json

linux:
  target:
    - AppImage
    - deb
  category: Utility
  maintainer: Aitor <aitor.x@outlook.com>
  # Electron uses desktopName for WM_CLASS so the window links to this entry.
  syncDesktopName: true
  # The widget has to read another window's geometry and position itself, which
  # only the X11 backend can do. Both the deb desktop entry and the AppImage
  # launcher carry this switch; main.js also relaunches itself once with the
  # flag when it detects a Wayland session without it.
  executableArgs:
    - --ozone-platform=x11
  synopsis: 跟随 Codex 窗口显示额度与语录的桌面挂件
  description: >-
    白发紫瞳龙娘挂件：读取本机 Codex 的额度窗口（或 API Key 登录下的 provider
    余额），在角色旁的气泡中显示剩余百分比、重置时间与语录。需要 Node.js 20 或更新版本。
  desktop:
    entry:
      Name: GPT 娘
      Comment: 跟随 Codex 窗口显示额度与语录
      StartupWMClass: gpt-niang-usage
      Categories: Utility;

deb:
  depends:
    - nodejs

# An AppImage cannot keep the setuid sandbox helper, and electron-builder's
# default for this target is --no-sandbox; setting executableArgs here replaces
# that default, so it has to be spelled out again next to the X11 switch.
appImage:
  executableArgs:
    - --ozone-platform=x11
    - --no-sandbox
